# Risk limits — the deterministic guardrails. The Risk Gatekeeper enforces these
# and has absolute veto power. Profile: MODERATE. All values tunable in paper.

account:
  # Hard kill switch: realized + unrealized loss vs start-of-day equity.
  # Checked once per cycle (a daily-swing system) -- NOT a continuous
  # intraday guard. On its own this bounds "new risk added today", not "what
  # every held position's stop could cost if they all fired the same day" --
  # that second number is bounded separately by max_open_risk_pct below, so
  # the 4% figure is a real worst-case ceiling, not just a same-day trigger.
  max_daily_loss_pct: 4.0
  # Sum of qty * |entry - stop| across ALL open positions, enforced at entry
  # time (RiskManager.evaluate() step 7.5) -- caps the worst case where every
  # held position's resting stop fires on the same day (e.g. a broad market
  # selloff). Defaults to max_daily_loss_pct itself if omitted, so the two
  # numbers stay coherent by construction rather than needing separate tuning.
  max_open_risk_pct: 4.0
  max_gross_exposure_pct: 175.0     # sum of |positions| vs equity (intraday margin up to 4x)
  max_open_positions: 10
  # Tightens max_open_risk_pct further for a CORRELATED cluster: sum of
  # qty*|entry-stop| across already-open positions whose trailing daily-return
  # correlation with a new entry's symbol is >= correlated_risk_threshold,
  # plus the new entry's own risk, enforced at RiskManager.evaluate() step 7.6
  # (src/risk/correlation.py). Exists because a strategy that can open several
  # positions from the same correlated bucket at once (e.g. cross-sectional
  # momentum, src/strategy/momentum.py, buying a whole sector rally) makes the
  # flat max_open_risk_pct cap above understate real risk -- correlated stops
  # tend to fire together in a selloff, not independently. Defaults to
  # max_open_risk_pct * 0.6 in code if omitted; positions whose correlation
  # can't be computed (missing/short history) fall back to the flat cap only,
  # never silently losing protection -- see src/risk/correlation.py.
  max_correlated_risk_pct: 2.5
  correlated_risk_threshold: 0.6
  correlation_lookback_days: 60

position:
  # Percentage-based, so these scale to any account size on their own -- but
  # sizing (src/risk/position_sizer.py) always rounds DOWN to a whole share
  # (no fractional-share support), and a strategy that can't size to at least
  # 1 share is vetoed outright ("sized to zero"), not resized smaller. On a
  # very small account (a few hundred dollars) with a tight stop and a
  # higher-priced symbol, 1% of equity / |entry-stop| can floor to 0 shares
  # more often than you'd expect from the percentages alone -- if entries are
  # being silently vetoed, check risk_dollars vs entry_price*|entry-stop| for
  # the specific symbol before assuming something's broken.
  max_position_pct: 10.0            # max single position vs equity
  max_per_symbol_pct: 10.0
  per_trade_risk_pct: 1.0          # equity risked per trade (drives position sizing)

allocation:
  # Equal risk budget across the three strategies (~1/3 of daily risk each).
  per_strategy_risk_pct: 1.33

circuit_breakers:
  max_orders_per_minute: 10        # runaway-loop guard
  order_rate_window_seconds: 60    # the rolling window max_orders_per_minute counts over -- was hardcoded
  max_orders_per_day: 50
  max_consecutive_errors: 5        # then HALT
  fat_finger_price_band_pct: 20.0  # reject orders priced >20% off last quote
  require_manual_reset_after_kill: true   # bot does NOT self-resume after a kill

# pdt: section removed 2026-08-21 -- FINRA retired the Pattern Day Trader
# rule (Regulatory Notice 26-10, effective 2026-06-04) for a dynamic
# intraday-margin framework, and Alpaca removed the daytrade_count/
# pattern_day_trader API fields on 2026-07-06. The gate this config drove
# was also confirmed dead independent of that: every caller hardcoded
# is_intraday=False, so it never fired for this daily-swing bot regardless.

# NOTE (honest config): connectivity handling is not a separate subsystem.
# Any broker/data API failure raises and the orchestrator's default-to-halt
# catch persists a HALT (class: exception/disconnect). Data freshness is
# enforced via settings.yaml -> data.max_bar_age_days.

# Universal ratchet-stop exit engine — parameters are PER STRATEGY.
# See docs/STRATEGIES.md. Mean-reversion MUST stay tight (small target).
ratchet_stop:
  trend_following:
    initial_stop_pct: 10.0
    lock_trigger_pct: 20.0
    profit_lock_pct: 10.0
    step_pct: 20.0
  mean_reversion:
    initial_stop_pct: 2.0
    profit_target_pct: 2.0         # exits at target / mean; tight stop, ~1:1 R:R
  breakout:
    atr_multiple_initial: 2.0
    atr_multiple_trail: 1.5

# Hybrid execution: the current stop always rests as a REAL order at the broker
# (attached atomically on entry, ratcheted up by the bot). There is no separate
# "catastrophe backstop" order — the resting stop IS the backstop; it protects
# even when the bot process is dead.
