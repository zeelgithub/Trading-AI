# Explicit, user-specified universe. No broad scanner in v1.
# Per-symbol overrides win over risk_limits.yaml's global default.
# Currently implemented: overrides.max_position_pct (RiskManager._max_position_pct).
#
# Widened 2026-08-22 from the original 3-symbol starter set (AAPL/MSFT/SPY)
# to the still-listed 27 names of settings.yaml -> research.backtest_universe
# -- the SAME liquid, sector-diverse large-cap basket trend_following was
# actually backtest-validated against (PF 3.64, p=0.037), not a new,
# unvalidated pick. This is deliberately about SAMPLE SIZE, not stock
# selection: 3 live symbols produce too few trades to tell a real edge from
# noise (the evaluation pipeline's own min_trades=30 bar needs real volume to
# clear). Excludes that universe's delisted names (SIVB/FRC/SBNY/RAD/YELL/
# PRTY) -- kept there deliberately to correct backtest survivorship bias, but
# untradeable today. Portfolio-level exposure is still bounded independently
# of how many symbols are here (risk_limits.yaml: max_open_positions: 10,
# max_open_risk_pct: 4.0) -- widening this list gives the strategy more
# chances to find its setup, it does not raise the aggregate risk ceiling.

watchlist:
  - symbol: AAPL
    enabled: true
    allow_short: false
    # overrides:
    #   max_position_pct: 8.0

  - symbol: MSFT
    enabled: true
    allow_short: false

  - symbol: SPY
    enabled: true
    allow_short: false

