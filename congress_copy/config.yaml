# Congress copy-trading config.

# Whose disclosures to mirror. One-line knob -- change and re-run.
# (Default: Ro Khanna -- the most active equities trader, max signal for v1.
#  Switch to "Nancy Pelosi" once options support exists for the real alpha.)
politician: "Ro Khanna"

equities_only: true            # skip option disclosures (bot is equities-only)
max_disclosure_age_days: 60    # ignore disclosures older than this (lag reality)
initial_stop_pct: 10.0         # protective stop attached to each mirrored buy
strategy_name: "congress_copy"

# Always shadow: decide + log only, place no orders (no execute toggle -- see
# copy_trader.py). data/disclosures.json and state/seen.json paths are fixed
# in run.py, not configurable here.
