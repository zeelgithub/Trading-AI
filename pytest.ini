[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
markers =
    integration: hits Alpaca's REAL paper API; needs live credentials, never run by default (see tests/integration/test_broker_alpaca_paper.py)
# Bare `pytest` stays offline/no-creds (CLAUDE.md's own invariant) -- opt in
# explicitly with `pytest -m integration tests/integration/`.
addopts = -m "not integration"
